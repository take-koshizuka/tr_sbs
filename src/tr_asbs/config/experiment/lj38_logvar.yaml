# @package _global_
#
# LJ-38, identical to lj38.yaml (EGNN, sped-up, energy-clipped, freq25 eval,
# fixed trust_region_bound=0.2) EXCEPT the u-controller is trained with the
# log-variance (VarGrad-style) FC loss instead of the importance-weighted
# cross-entropy loss -- see adjoint_matching_log_variance_step in
# train_gamma_asbs_iw.py. gamma is still computed every outer loop via the same
# dual optimization (optimize_gamma); only how u is fit to that target changes.
#
# This is a genuinely new implementation (not validated elsewhere in this repo,
# unlike the analogous log-variance loss already available for the v-corrector
# in train_general_asbs_iw.py) using a coarse two-interval trajectory
# approximation -- treat as exploratory.

name: lj38_egnn_logvar_tr_asbs
fabric:
  loggers:
    tags: [lj38, egnn, eval25, log_variance]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.lennardjones_energy.LennardJonesEnergyNoGT
  n_particles: 38
  spatial_dim: 3
  energy_clip: 10000.0 # clip each pairwise LJ term to avoid 1/r^12 blowups from near-overlaps

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.2
iw_clip_value: 5.0

# Use the importance-weight-free log-variance FC loss instead of cross-entropy.
fc_loss_mode: log_variance

################################################################################
# Training settings
################################################################################
max_outer_loops: 30
adjoint_matching_epochs: 200
corrector_matching_epochs: 50
steps_per_epoch: 100
train_batch_size: 150
inference_batch_size: 500
num_samples_for_dual_loss: [500, 20]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 25
monitor_values: ["loss/neg_avg_energy"]

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

initial_buffer_samples: 500
buffer_samples_per_epoch: 500
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.MeanFreePrior
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  scale: 1.5

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.1
  sigma_max: 1.0

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 100
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0
