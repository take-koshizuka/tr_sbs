# @package _global_
#
# Diagnostic variant of lj13_logvar_fast.yaml (identical in every other
# respect: eps=0.2, EGNN-fast, log-variance loss) with the SDE integration
# shortened from 200 to 50 steps.
#
# Motivation: across the whole eps sweep (0.05/0.1/0.2/0.3/0.5) the buffer-wide
# RN[h|u]/ess diagnostic stays pinned at its floor (~2e-5 = 1/max_size) almost
# regardless of eps, even while the adaptive trust-region dual optimization
# (optimize_gamma) correctly drives gamma down to tiny values (as low as 1e-4)
# in response -- i.e. the mechanism meant to control importance-weight variance
# is working, but still can't rescue ESS. The per-sample importance weight is
# the (r-rescaled) Girsanov path log-likelihood-ratio dP^h/dP^u accumulated
# over the *entire* SDE integration (200 steps for LJ-13's 39-dim state) --
# variance of a sum of ~200 roughly-independent per-step log-ratio
# contributions grows with step count, so this is a direct, cheap test of
# whether that path-length-driven variance accumulation is the dominant driver
# of the collapse (fewer steps -> less accumulated variance -> healthier ESS),
# as opposed to something eps/gamma-independent and structural elsewhere.
#
# Untested hyperparameter interaction: halving the SDE resolution 4x may
# itself change solution quality/Eq-EMD2 independent of the ESS question --
# interpret results as "does ESS/EMD2 improve" relative to lj13_logvar_fast.yaml
# at a similar epoch count, not as an absolute quality number.

name: lj13_egnn_logvar_fast_steps50_tr_asbs
fabric:
  loggers:
    tags: [lj13, egnn, log_variance, fast, steps50]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.lennardjones_energy.LennardJonesEnergy
  n_particles: 13
  spatial_dim: 3
  ref_samples_path: "./data/test_split_LJ13-1000.npy"
  energy_clip: 10000.0

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.2
iw_clip_value: 5.0

# Use the importance-weight-free log-variance FC loss instead of cross-entropy.
fc_loss_mode: log_variance

################################################################################
# Training settings
################################################################################
max_outer_loops: 2000 # effectively unbounded given the SLURM time limit; run until killed
adjoint_matching_epochs: 200
corrector_matching_epochs: 50
steps_per_epoch: 100
train_batch_size: 150
inference_batch_size: 1000
num_samples_for_dual_loss: [500, 20]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 25
monitor_values: ["loss/Eq-EMD2", "loss/neg_avg_energy"]

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0
loss_1_weight: 1.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

initial_buffer_samples: 1000
buffer_samples_per_epoch: 1000
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.MeanFreePrior
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  scale: 2.0

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.001
  sigma_max: 0.5

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 50
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0

E_max: 10000
