# @package _global_
name: spice
fabric:
  loggers:
    tags: [spice]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.fairchem_energy.FairChemEnergy
  model_ckpt: "./models/esen_spice.pt"
  tau : 5e-3
  alpha : 1e2

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.3
iw_clip_value: 10

################################################################################
# Training settings
################################################################################
max_outer_loops: 1
adjoint_matching_epochs: 2000
corrector_matching_epochs: ${adjoint_matching_epochs}
steps_per_epoch: 100
train_batch_size: 250
inference_batch_size: 1000
num_samples_for_dual_loss: [1000, 20]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 500

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.chem_egnn.EGNN_dynamics
  #n_particles: ${potential.n_particles}
  #spatial_dim: ${potential.spatial_dim}
  n_atoms: 100
  hidden_nf: 128
  n_layers: 5
  agg: sum

corrector:
  _target_: tr_asbs.model.chem_egnn.EGNN_dynamics
  #n_particles: ${potential.n_particles}
  #spatial_dim: ${potential.spatial_dim}
  n_atoms: 100
  hidden_nf: 128
  n_layers: 5
  agg: sum

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 10000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 10000

initial_buffer_samples: 1000
buffer_samples_per_epoch: 1000
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.utils.chem_utils.CenteredRDKit
  n_systems_per_batch: 8
  smiles_list:
    _target_: tr_asbs.utils.chem_utils.get_smiles_list
    filepath: data/spice_train_rot3-10.txt

base_sde:
  _target_: tr_asbs.process.sde.ChemVESDE
  sigma_min: 0.001
  sigma_max: 0.3

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 200
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ChemGradTermCost
  grad_clip_val: 100.0
  