[project]
name = "tr_asbs"
version = "0.1.0"
description = "Trust Region Adjoint Schrodinger Bridge Sampler"
readme = "README.md"
authors = [
    { name = "Takeshi Koshizuka", email = "takeshikoshizuka938444@gmail.com" },
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "ase>=3.25.0",
    "e3nn>=0.5.8",
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "jax>=0.6,<0.7",
    "equinox>=0.13.2",
    "lightning>=2.5.0",
    "matplotlib>=3.10.7",
    "mdtraj>=1.11.0",
    "mpiplus",
    "netcdf4>=1.7.3",
    "normflows>=1.7.3",
    "numpy>=2.2.6",
    "openmm-cuda-12>=8.4.0",
    "openmm>=8.4.0",
    "openmmtools",
    "ott-jax>=0.6.0",
    "pot>=0.9.6.post1",
    "pymbar>=4.0.3",
    "seaborn>=0.13.2",
    "tables>=3.10.2",
    "tqdm>=4.67.1",
    "wandb>=0.23.0",
]

[project.optional-dependencies]
chem = [
    "fairchem-core>=2.4.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
mpiplus = { git = "https://github.com/choderalab/mpiplus", tag = "v0.0.2" }
openmmtools = { git = "https://github.com/choderalab/openmmtools", tag = "0.25.0" }

[dependency-groups]
dev = [
    "prek>=0.2.19",
    "ruff>=0.14.7",
]
mlcv = [
    "deeptime>=0.4.5",
    "mlcolvar>=1.2.2",
]
