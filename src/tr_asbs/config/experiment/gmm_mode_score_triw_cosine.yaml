# @package _global_
defaults:
  - gmm_mode
  - _self_

# The original mode-series target: K=40, d=10, loc_scaling=40,
# source.scale=30. Only TR-IW's noise schedule changes from VE.
name: gmm_mode_score_triw_cosine

score_conditioned_model:
  _target_: tr_asbs.variational.TRIWScoreConditionedControl
  dim: ${potential.dim}
  num_steps: 128
  num_layers: 2
  num_hid: 64
  outer_clip: 1.0e4
  inner_clip: 1.0e2
  weight_init: 1.0e-8
  bias_init: 1.0

controller: ${score_conditioned_model}
corrector: ${score_conditioned_model}

base_sde:
  _target_: tr_asbs.process.sde.PISCosineSDE
  sigma_min: 0.1
  sigma_max: 32.0
  num_steps: 128
  s: 0.008
  power: 2.0

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 128
    rescale_t: null

report_seed: 12345
