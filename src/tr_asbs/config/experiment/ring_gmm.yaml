


# @package _global_
name: tr_asbs
fabric:
  loggers:
    tags: [ring_gmm]

seed: 0

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.ring_gmm.RingGMM

  device: cuda
  dim: 2 # todo
  num_components: 4
  weight_layout: up_down
  radius: 10
  scale: 0.5
  log_Z: 0

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.3
iw_clip_value: 10

################################################################################
# Training settings
################################################################################
max_outer_loops: 80
adjoint_matching_epochs: 150 # todo
corrector_matching_epochs: 150 # todo
steps_per_epoch: 100
train_batch_size: 1000
inference_batch_size: 100
num_samples_for_dual_loss: [5000, 40]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 200 # todo
monitor_values: ["loss/neg_avg_energy"]

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.mlp.FourierMLP
  dim: ${potential.dim}
  num_layers: 4
  channels: 256
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.mlp.FourierMLP
  dim: ${potential.dim}
  num_layers: 4
  channels: 256
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000 # todo

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000 # todo

initial_buffer_samples: 10000
buffer_samples_per_epoch: 250
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.GaussianPrior
  dim: ${potential.dim}
  scale: 10.0 # 2.5

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.1
  sigma_max: 1.0

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 200 # todo
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0

corrector_matching_mode: full
