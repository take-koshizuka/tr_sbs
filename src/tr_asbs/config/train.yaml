# @package _global_
defaults:
  - _self_
  - experiment: ring_gmm
root: ${oc.env:TR_ASBS_ROOT,/scratch/htc/tkoshizuka/tr_asbs}
# root: /scratch/htc/tkoshizuka/tr_asbs
seed: 0

hydra:
  run:
    dir: ${root}/${name}

curriculum: null

log_loss_interval_step: 50
log_detail_interval_epoch: 20
checkpoint_directory: ${hydra:run.dir}/checkpoints/
save_checkpoint_interval_epoch: 10000
pretrained_controller_checkpoint: null

eval_samples: 2000
eval_samples_final: 4000
save_samples: false
sample_directory: ${hydra:run.dir}/samples
save_sample_interval_epoch: 20

progress_bar: true
num_workers: 0
compile: false  # ffor direct prediction
resume: false
ema_decay: null
ema_start_step: 0
visualize: false
monitor_modes: {}
monitor_initial_state: true
keep_best_checkpoints: true

# Opt-in compute guard for expensive sweeps. It stops only on sustained joint
# degradation, never merely because a metric has plateaued.
divergence_early_stop:
  enabled: false
  primary_metric: loss/SD
  secondary_metric: loss/tvd_soft
  min_evals: 20
  primary_factor: 2.0
  secondary_delta: 0.15
  patience: 8
  nonfinite_patience: 2

# Corrector-side trust-region damping (opt-in; "none" preserves existing
# behavior exactly). See train_gamma_asbs_iw.py's GammaASBSModule.__init__ and
# compute_corrector_gamma() for what "reuse_u_gamma"/"independent" do.
corrector_gamma_mode: none
corrector_trust_region_bound: null
adjoint_buffer_duplicates: 1
checkpoint_group_id: null
per_time_anchor_target: false
gamma_floor: 0.0

# Opt-in (default off, preserving existing behavior exactly): clear the
# adjoint buffer at the start of every outer loop so it never mixes samples
# from two different (u, h) snapshots (see train_gamma_asbs_iw.py's
# inner_loop_u for the exact rationale).
clear_adjoint_buffer_per_outer_loop: false

# backward loss defaults (used by train_general_asbs_iw.py)
backward_loss_mode: score_matching
backward_loss_terms: [score_matching]
score_matching_weight: 1.0
consistency_loss_weight: 0.0
consistency_loss_full_path_weight: 0.0
consistency_var_full_path_weight: 0.0

fabric:
  _target_: lightning.fabric.Fabric
  accelerator: cuda
  strategy: auto
  devices: 1
  num_nodes: 1
  loggers:
    _target_: wandb.integration.lightning.fabric.WandbLogger
    name: ${name}
    entity: ml-takeshi-work
    project: tr_asbs
    #entity: ais2t_guests
    #project: measure_transport
    tags: null
    save_dir: ${hydra:run.dir}
    group: null
  
wandb_host: https://api.wandb.ai
wandb_mode: online
