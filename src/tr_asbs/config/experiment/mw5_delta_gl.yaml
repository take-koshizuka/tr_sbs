# @package _global_
name: mw5_delta_gl_gamma_asbs
fabric:
  loggers:
    tags: [mw5, gl]

seed: 2

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.ginzburg_landau_energy.GinzburgLandauEnergy
  dim: 8
  m: 5
  delta: 4.0
  periodic_boundary: true
  coupling_strength: 1.0

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.3
iw_clip_value: 1.0

################################################################################
# Training settings
################################################################################
max_outer_loops: 80
adjoint_matching_epochs: 150
corrector_matching_epochs: 150
steps_per_epoch: 100
train_batch_size: 1000
inference_batch_size: 10000
num_samples_for_dual_loss: [5000, 40]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 200
monitor_values: ["loss/neg_avg_energy"]
visualize: false

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.mlp.FourierMLP
  dim: ${potential.dim}
  num_layers: 4
  channels: 256
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.mlp.FourierMLP
  dim: ${potential.dim}
  num_layers: 4
  channels: 256
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

initial_buffer_samples: 10000
buffer_samples_per_epoch: 10000
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.GaussianPrior
  dim: ${potential.dim}
  scale: 1.0

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.01
  sigma_max: 0.2
  
integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 200
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0

corrector_matching_mode: full
# visualize: true
