# @package _global_
#
# LJ-38 ASBS baseline (for train_asbs.py -- Eq. 14/15 in the paper, no
# importance weighting, no trust region, plain fixed-point IPF iteration).
# Needed as Phase 1 of the "ASBS -> IW/TR" curriculum (see
# lj38_logvar_warmstart_asbs.yaml / lj38_ce_warmstart_asbs.yaml) -- unlike
# LJ-13, no ASBS baseline checkpoint existed yet for LJ-38 before this.
#
# Architecture/SDE/buffer parameters copied from lj38.yaml (the standard
# gamma_asbs_iw LJ-38 config) so the resulting checkpoint's controller/
# corrector are directly loadable into the gamma_asbs_iw trainer for Phase 2 --
# same potential, same shrunk EGNN (3 layers/64 hidden/no attention), same
# VESDE/integrator. No ground-truth samples exist for LJ-38 (LennardJonesEnergyNoGT),
# so monitor_values only tracks energy, not Eq-EMD2.

name: lj38_asbs_baseline
fabric:
  loggers:
    tags: [lj38, asbs_baseline]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.lennardjones_energy.LennardJonesEnergyNoGT
  n_particles: 38
  spatial_dim: 3
  energy_clip: 10000.0

################################################################################
# Settings for Gamma (unused by train_asbs.py, kept for config-schema parity)
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.2
iw_clip_value: 5.0

################################################################################
# Training settings
################################################################################
max_outer_loops: 50
adjoint_matching_epochs: 200
corrector_matching_epochs: 50
steps_per_epoch: 100
train_batch_size: 150
inference_batch_size: 500
num_samples_for_dual_loss: [500, 20]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 250
monitor_values: ["loss/neg_avg_energy"]

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0
loss_1_weight: 1.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

initial_buffer_samples: 500
buffer_samples_per_epoch: 500
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.MeanFreePrior
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  scale: 1.5

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.1
  sigma_max: 1.0

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 100
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0
