[project]
name = "tr_asbs"
version = "0.1.0"
description = "Trust Region Adjoint Schrodinger Bridge Sampler"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*", "src/mace/MIT.md"]
authors = [
    { name = "Takeshi Koshizuka", email = "takeshikoshizuka938444@gmail.com" },
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "ase>=3.25.0",
    "hydra-core>=1.3.2",
    "lightning>=2.5.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pot>=0.9.6.post1",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "wandb>=0.23.0",
]

[project.optional-dependencies]
molecular = [
    "mdtraj>=1.11.0",
    "mpiplus",
    "netcdf4>=1.7.3",
    "normflows>=1.7.3",
    "openmm>=8.4.0",
    "openmmtools",
    "pymbar>=4.0.3",
    "tables>=3.10.2",
]
cuda = [
    "openmm-cuda-12>=8.4.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
jax = [
    "jax>=0.6,<0.7",
    "equinox>=0.13.2",
    "ott-jax>=0.6.0",
]
chem = [
    "e3nn>=0.5.8",
    "fairchem-core>=2.4.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["tr_asbs", "mace"]
source-include = [
    "uv.lock",
    ".python-version",
    "docs/**",
    "scripts/**",
    "tests/**",
    "sweeps/**",
    "reports/gmm_scorefree_six_methods/**",
]

[tool.uv.sources]
mpiplus = { git = "https://github.com/choderalab/mpiplus", tag = "v0.0.2" }
openmmtools = { git = "https://github.com/choderalab/openmmtools", tag = "0.25.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "prek>=0.2.19",
    "ruff>=0.14.7",
]
notebooks = [
    "ipykernel>=7.1.0",
]
mlcv = [
    "deeptime>=0.4.5",
    "mlcolvar>=1.2.2",
]
