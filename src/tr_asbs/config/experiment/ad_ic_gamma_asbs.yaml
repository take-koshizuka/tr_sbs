# @package _global_
name: asbs
fabric:
  loggers:
    tags: [ad_ic_v1]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.alanine_dipeptide_energy.AlanineDipeptideEnergyIC
  dim: 60  # Native internal coordinates; Cartesian dimension is 66.
  transform_data_path: "./data/alanine_dipeptide/val.h5"
  transform_max_frames: 4096
  transform_stride: 100
  transform_offset: 0
  ref_samples_path: "./data/alanine_dipeptide/val.h5"
  reference_max_frames: 4096
  reference_stride: 100
  reference_offset: 500000

# Transform calibration and validation use disjoint frame ranges. The separate
# test.h5 file is reserved for final evaluation, never tuning/calibration.
ic_dim: 60

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 1.0
iw_clip_value: 10

################################################################################
# Training settings
################################################################################
max_outer_loops: 40
adjoint_matching_epochs: 2000
corrector_matching_epochs: 1000
steps_per_epoch: 100
train_batch_size: 500
inference_batch_size: 1000
num_samples_for_dual_loss: [500, 20]
monitor_values: ["loss/neg_avg_energy"]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 500

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.mlp.FourierMLP
  dim: ${ic_dim}
  num_layers: 8
  channels: 256
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.mlp.FourierMLP
  dim: ${ic_dim}
  num_layers: 8
  channels: 256
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 10000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 10000

initial_buffer_samples: 1000
buffer_samples_per_epoch: 1000
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.GaussianPrior
  dim: ${ic_dim}
  scale: 1.0

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.001
  sigma_max: 0.5

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 200
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0

E_max: 10000.0
visualize: true
corrector_matching_mode: full
