# @package _global_
#
# LJ-55, mostly identical to lj55.yaml (EGNN, ground-truth ref samples,
# Eq-EMD2 metric): trust_region_bound is fixed to 0.2 (matching the LJ-38 run
# that showed healthy, steadily-improving gamma/ESS/energy), and the
# u-controller uses the log-variance (VarGrad-style) FC loss instead of
# cross-entropy -- see adjoint_matching_log_variance_step in
# train_gamma_asbs_iw.py. UNLIKE lj55.yaml, the EGNN is shrunk (3 layers, 64
# hidden, no attention -- same size as the working LJ-38 log-variance run)
# because the dense log-variance loss's batched-trajectory forward pass
# (batch_size * integrator_steps rows) does not fit a 44GB GPU at LJ-55's
# full size at any batch large enough for a meaningful variance estimate --
# see the train_batch_size comment below for the measured numbers.

name: lj55_egnn_logvar_tr_asbs
fabric:
  loggers:
    tags: [lj55, egnn, log_variance]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.lennardjones_energy.LennardJonesEnergy
  n_particles: 55
  spatial_dim: 3
  ref_samples_path: "./data/test_split_LJ55-1000-part1.npy"
  energy_clip: 10000.0 # same fix as LJ-13 -- see lj13_logvar_fast.yaml for the writeup

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.2
iw_clip_value: 10

# Use the importance-weight-free log-variance FC loss instead of cross-entropy.
fc_loss_mode: log_variance

################################################################################
# Training settings
################################################################################
max_outer_loops: 2000 # effectively unbounded given the SLURM time limit; run until killed
adjoint_matching_epochs: 300
corrector_matching_epochs: 20
steps_per_epoch: 300
# Measured directly (scratch_egnn_mem_probe_lj55.py): with the base lj55.yaml
# full-size EGNN (5 layers, 128 hidden, attention) the batched-trajectory
# forward pass (batch_size * 200 integrator steps, rows through the EGNN)
# costs ~71MB/row -- batch_size=1 alone needs ~14GB and batch_size=2 already
# ~29GB, leaving no headroom and no way to get a batch large enough for a
# meaningful variance estimate (the log-variance loss needs Var() over the
# batch dim, so batch_size=1 is degenerate). Shrinking the EGNN to the same
# size already used for the working LJ-38 log-variance run (3 layers, 64
# hidden, no attention -- see controller/corrector below) cuts this to
# ~13MB/row, making batch_size=8 (~31GB, measured) comfortably fit alongside
# the rest of the pipeline. Integrator steps (200) and trust_region_bound
# (0.2) are unchanged.
train_batch_size: 8
inference_batch_size: 1000
num_samples_for_dual_loss: [100, 10]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 50
monitor_values: ["loss/Eq-EMD2", "loss/neg_avg_energy"]

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 10000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 10000

initial_buffer_samples: 1000
buffer_samples_per_epoch: 1000
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.MeanFreePrior
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  scale: 1.0

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.5
  sigma_max: 2.0

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 200
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0
