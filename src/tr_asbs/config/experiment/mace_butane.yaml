# @package _global_
#
# Butane (trans-butane, 14 atoms: C4H10) sampled under a pretrained MACE-OFF23
# potential -- a real (if small) organic molecule with genuine multimodality
# (the classic anti/gauche rotamer conformers around the central C-C-C-C
# dihedral), substituting for the originally-discussed FairChem/eSEN target
# (see mace_off_energy.py for why: the eSEN checkpoint is gated on HuggingFace
# without approved access, and the codebase's fairchem_energy.py no longer
# even imports against the currently-installed fairchem-core API).
#
# No ground-truth reference samples exist for this potential (unlike LJ-13/55),
# so evaluation is energy statistics + ESS diagnostics only, same pattern as
# LennardJonesEnergyNoGT. Multimodality (rotamer basins) should show up as
# distinct clusters if you later histogram the central C-C-C-C dihedral angle
# from saved samples -- no custom visualization for that is wired in yet.
#
# Atoms are chemically distinct (not exchangeable like LJ particles), so the
# controller/corrector use a plain FourierMLP over the flattened (42-dim)
# coordinate vector rather than an EGNN -- no permutation-equivariance needed,
# and much cheaper per step than the EGNN work this session has been fighting.
#
# VESDE/prior scales and epoch/batch counts below are first guesses (this
# potential has never been run before) -- treat as a starting point, not a
# tuned recipe.

name: mace_butane_logvar_tr_asbs
fabric:
  loggers:
    tags: [mace_off, butane, mlp, log_variance]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.mace_off_energy.MaceOffEnergy.from_ase_molecule
  molecule_name: trans-butane
  model_size: small
  energy_clip_range: 2000.0

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.2
iw_clip_value: 5.0

# Use the importance-weight-free log-variance FC loss instead of cross-entropy.
fc_loss_mode: log_variance

################################################################################
# Training settings
################################################################################
max_outer_loops: 2000 # effectively unbounded given the SLURM time limit; run until killed
adjoint_matching_epochs: 200
corrector_matching_epochs: 50
steps_per_epoch: 100
train_batch_size: 150
inference_batch_size: 500
num_samples_for_dual_loss: [200, 20]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 25
monitor_values: ["loss/neg_avg_energy"]
eval_samples: 500

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.mlp.FlattenReshapeWrapper
  n_particles: 14
  spatial_dim: 3
  base_model:
    _target_: tr_asbs.model.mlp.FourierMLP
    dim: 42 # 14 atoms * 3 spatial dims
    num_layers: 6
    channels: 256
    clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.mlp.FlattenReshapeWrapper
  n_particles: 14
  spatial_dim: 3
  base_model:
    _target_: tr_asbs.model.mlp.FourierMLP
    dim: 42
    num_layers: 6
    channels: 256
    clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0
loss_1_weight: 1.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

initial_buffer_samples: 500
buffer_samples_per_epoch: 500
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.MeanFreePrior
  n_particles: 14
  spatial_dim: 3
  scale: 2.0

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.01
  sigma_max: 2.0

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 100
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0
