# @package _global_
#
# Morse-13, cross-entropy (importance-weighted forward-KL) FC loss + adaptive
# trust region -- the direct Morse counterpart of lj13_ce_fast.yaml, testing
# whether a softer (exponential, not r^-12) repulsive wall reduces the
# catastrophic Girsanov log-importance-weight variance measured for LJ-13
# (mean~300, std~2515, max~40099 -- see morse_energy.py's module docstring and
# scratch_diagnose_optimize_gamma.py). Architecture/SDE/buffer/gamma
# hyperparameters are identical to lj13_ce_fast.yaml so any behavioral
# difference is attributable to the potential's shape.
#
# No ground-truth reference samples exist for Morse-13 (different equilibrium
# distribution from LJ-13), so this uses MorseEnergyNoGT and monitor_values
# tracks only energy, not Eq-EMD2.

name: morse13_egnn_ce_fast_tr_asbs
fabric:
  loggers:
    tags: [morse13, egnn, cross_entropy, fast]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.morse_energy.MorseEnergyNoGT
  n_particles: 13
  spatial_dim: 3
  eps: 1.0
  rm: 1.0
  a: 6.0  # curvature-matched to LJ's V''(rm)=72*eps/rm^2 -- see morse_energy.py
  energy_clip: 10000.0

################################################################################
# Settings for Gamma
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.2
iw_clip_value: 5.0

# Default cross-entropy (importance-weighted forward-KL) FC loss.
fc_loss_mode: cross_entropy

################################################################################
# Training settings
################################################################################
max_outer_loops: 2000 # effectively unbounded given the SLURM time limit; run until killed
adjoint_matching_epochs: 200
corrector_matching_epochs: 50
steps_per_epoch: 100
train_batch_size: 200
inference_batch_size: 1000
num_samples_for_dual_loss: [500, 20]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 25
monitor_values: ["loss/neg_avg_energy"]

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0
loss_1_weight: 1.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

initial_buffer_samples: 1000
buffer_samples_per_epoch: 1000
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.MeanFreePrior
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  scale: 2.0

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.001
  sigma_max: 0.5

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 200
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0

E_max: 10000
