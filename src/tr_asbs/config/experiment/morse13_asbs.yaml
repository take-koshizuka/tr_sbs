# @package _global_
#
# Morse-13 ASBS baseline (train_asbs.py -- plain fixed-point IPF, no
# importance weighting, no trust region). Phase 1 for the same kind of
# ASBS<->IW/TR curriculum as LJ-13, and also the reference point for judging
# whether morse13_ce_fast.yaml's cold-start TR-SBS training behaves
# differently from LJ-13's under a softer (exponential, not r^-12) repulsive
# wall -- see morse_energy.py's module docstring for the full motivation.
#
# Architecture/SDE/buffer parameters otherwise identical to lj13_asbs_fast.yaml
# so any difference in behavior is attributable to the potential's shape, not
# a confounding hyperparameter change. No ground-truth reference samples exist
# for Morse-13 (a different equilibrium distribution from LJ-13), so this uses
# MorseEnergyNoGT and monitor_values tracks only energy, not Eq-EMD2.

name: morse13_asbs_baseline
fabric:
  loggers:
    tags: [morse13, asbs_baseline]

seed: 0
compile: false

################################################################################
# Potentials
################################################################################
potential:
  _target_: tr_asbs.potential.morse_energy.MorseEnergyNoGT
  n_particles: 13
  spatial_dim: 3
  eps: 1.0
  rm: 1.0
  a: 6.0  # curvature-matched to LJ's V''(rm)=72*eps/rm^2 -- see morse_energy.py
  energy_clip: 10000.0

################################################################################
# Settings for Gamma (unused by train_asbs.py, kept for config-schema parity)
################################################################################
gamma: 1.0
gamma_schedule: trust_region
trust_region_bound: 0.2
iw_clip_value: 5.0

################################################################################
# Training settings
################################################################################
max_outer_loops: 50
adjoint_matching_epochs: 200
corrector_matching_epochs: 50
steps_per_epoch: 100
train_batch_size: 200
inference_batch_size: 1000
num_samples_for_dual_loss: [500, 20]

################################################################################
# Logging
################################################################################
log_detail_interval_epoch: 250
monitor_values: ["loss/neg_avg_energy"]

################################################################################
# Models
################################################################################
controller:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

corrector:
  _target_: tr_asbs.model.egnn.EGNN_dynamics
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  n_layers: 3
  hidden_nf: 64
  attention: false
  agg: sum
  compile: ${compile}
  clip_norm: 100.0

################################################################################
# Optimization
################################################################################
controller_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

corrector_optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  weight_decay: 0.0

gradient_clip_val: 100.0
loss_1_weight: 1.0

################################################################################
# Buffers
################################################################################
adjoint_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

corrector_buffer:
  _target_: tr_asbs.data.buffer.BatchBuffer
  max_size: 50000

initial_buffer_samples: 1000
buffer_samples_per_epoch: 1000
log_buffer_energy: true
log_buffer_grad_norm: true

################################################################################
# Process and integration
################################################################################
source:
  _target_: tr_asbs.process.source.MeanFreePrior
  n_particles: ${potential.n_particles}
  spatial_dim: ${potential.spatial_dim}
  scale: 2.0

base_sde:
  _target_: tr_asbs.process.sde.VESDE
  sigma_min: 0.001
  sigma_max: 0.5

integrator:
  _target_: tr_asbs.process.integrator.ExponentialIntegrator
  timesteps:
    _target_: tr_asbs.process.integrator.get_timesteps
    t0: 0.0
    t1: 1.0
    steps: 200
    rescale_t: null

################################################################################
# Terminal cost
################################################################################
terminal_cost:
  _target_: tr_asbs.process.terminal_cost.ASBSTerminalCost
  grad_clip_val: 100.0

E_max: 10000
